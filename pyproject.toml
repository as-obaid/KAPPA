[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa"
version = "0.0.0"
description = "Knee abnormality prediction with pretrained architectures (RSNA Knee Abnormality Detection)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Obaidullah", email = "abdulsalam.m@northeastern.edu" }]

# The data pipeline is declared. Modelling deps live in the optional 'train'
# extra, not here, so that a laptop without CUDA can still run every test that
# does not touch a GPU.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydicom>=2.4",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "pydantic>=2",
]

[project.optional-dependencies]
data = ["kaggle>=1.6"]
dev = ["pytest>=8.0"]
# Modelling deps are optional so the label pipeline, the manifest build and the
# submission path still import on a machine with no CUDA and no torch, and the
# test suite collects there (the modelling modules pytest.importorskip torch).
#
# The modules that may import torch AT MODULE SCOPE are exactly:
#   kappa.models.*, kappa.training.*, kappa.data.augment, kappa.data.dataset,
#   kappa.inference.predict
# Everything else must import without it. Both halves are pinned by
# TestTheInferenceBoundary in tests/test_loop.py -- a boundary nothing checks is
# a boundary that drifts.
#
# cu126 rather than cu130: cu130 is a vLLM constraint, and cu126 is
# CUDA minor-version compatible with every 12.x driver.
train = ["torch>=2.4", "timm>=1.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
