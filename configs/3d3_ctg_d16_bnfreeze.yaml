# 3d3_ctg_d16 with the backbone's BatchNorm3d layers frozen at their pretrained
# statistics. Tests whether noisy batch statistics at micro-batch 4 drive the 3D model's
# early overfitting; 3d3_ctg_d16_bs8 tests the same question by doubling the micro-batch
# instead.

name: 3d3_ctg_d16_bnfreeze
seed: 0
seeds: [0, 1]  # extra seeds for --noise-floor; not in config_hash
out_dir: data/runs

data:
  slots: ["Axial_fs1", "Coronal_fs1", "Sagittal_fs1"]
  n_slices: 16  # the volume depth D
  stack: 3  # each slice plus its two neighbours, as 3 input channels
  size: 384
  physical_crop_mm: 150.0  # fixed field of view, so mm/px is the same on every scanner
  cache_dir: data/processed/cache
  manifest: data/interim/manifest.parquet
  labels: data/interim/labels/derived.parquet
  anchors_override: true  # the 58 hand-labelled studies override their derived labels
  series_dropout: 0.1  # drops slots at random, so training sees missing series
  num_workers: 8

volume:
  mode: contiguous  # D adjacent slices

model:
  backbone: r3d_18
  pretrained: true
  drop_path_rate: 0.0  # torchvision video models have no stochastic depth
  aux_dim: 0
  freeze_backbone_bn: true  # BatchNorm3d keeps its pretrained running statistics

loss:
  gamma_neg: 4.0  # asymmetric loss; missing label cells are masked out
  gamma_pos: 0.0
  clip: 0.05
  gamma_neg_by_label:  # symmetric loss for the two majority-positive labels
    "Medial Meniscus": 0.0
    "Effusion": 0.0

optim:
  lr: 5.0e-5
  backbone_lr_mult: 0.1  # backbone learning rate = lr x this; the head uses lr
  weight_decay: 0.01
  schedule: onecycle
  warmup_pct: 0.1
  epochs: 8
  batch_size: 4  # 4 x 4 accumulation keeps the effective batch at 16
  grad_accum: 4
  max_grad_norm: 1.0
  amp: true
  amp_dtype: bf16

folds:
  n_folds: 5
  file: data/folds/folds_v2.csv  # 685 studies held out as a test split
  column: fold

augment:
  rotate_deg: 10.0
  brightness: 0.1
  contrast: 0.1
  cutmix_prob: 1.0
  cutmix_alpha: 1.0
