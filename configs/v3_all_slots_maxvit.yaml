# Slot/backbone grid, all 6 slots (axial, coronal and sagittal, with and without fat
# saturation) x MaxViT-tiny, 384 px, 8 epochs. Differs from v2_fs_three_planes_maxvit in
# the slots and a smaller micro-batch.

name: v3_all_slots_maxvit
seed: 0
seeds: [0, 1]  # extra seeds for --noise-floor; not in config_hash
out_dir: data/runs

data:
  slots: ["Axial_fs0", "Axial_fs1", "Coronal_fs0", "Coronal_fs1",
          "Sagittal_fs0", "Sagittal_fs1"]
  n_slices: 16
  stack: 3  # each slice plus its two neighbours, as 3 input channels
  size: 384
  physical_crop_mm: 150.0  # fixed field of view, so mm/px is the same on every scanner
  cache_dir: data/processed/cache
  manifest: data/interim/manifest.parquet
  labels: data/interim/labels/derived.parquet
  anchors_override: true  # the 58 hand-labelled studies override their derived labels
  series_dropout: 0.1  # drops slots at random, so training sees missing series
  num_workers: 8

model:
  backbone: maxvit_tiny_tf_384
  pretrained: true
  drop_path_rate: 0.2
  aux_dim: 0

loss:
  gamma_neg: 4.0  # asymmetric loss; missing label cells are masked out
  gamma_pos: 0.0
  clip: 0.05

optim:
  lr: 5.0e-5
  weight_decay: 0.01
  schedule: onecycle
  warmup_pct: 0.1
  epochs: 8
  batch_size: 2  # 2 x 8 accumulation keeps the effective batch at 16
  grad_accum: 8
  max_grad_norm: 1.0
  amp: true
  amp_dtype: bf16

folds:
  n_folds: 5
  file: data/folds/folds_v2.csv  # 685 studies held out as a test split
  column: fold
