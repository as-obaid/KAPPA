# 3d_ctg_d32 with an r2plus1d_18 backbone (each 3D convolution split into spatial and
# through-plane parts) and 10 epochs. 3d_ctg_d32 ran at 8 epochs, so compare within the
# w5_3d_* configs.

name: w5_3d_r2p1_d32_ctg
seed: 0
seeds: [0, 1]  # extra seeds for --noise-floor; not in config_hash
out_dir: data/runs

data:
  slots: ["Axial_fs1"]
  n_slices: 32  # the volume depth D
  stack: 3  # each slice plus its two neighbours, as 3 input channels
  size: 384
  physical_crop_mm: 150.0  # fixed field of view, so mm/px is the same on every scanner
  cache_dir: data/processed/cache
  manifest: data/interim/manifest.parquet
  labels: data/interim/labels/derived.parquet
  anchors_override: true  # the 58 hand-labelled studies override their derived labels
  series_dropout: 0.0
  num_workers: 8

volume:
  mode: contiguous  # D adjacent slices

model:
  backbone: r2plus1d_18
  pretrained: true
  drop_path_rate: 0.0  # torchvision video models have no stochastic depth
  aux_dim: 0

loss:
  gamma_neg: 4.0  # asymmetric loss; missing label cells are masked out
  gamma_pos: 0.0
  clip: 0.05

optim:
  lr: 5.0e-5
  backbone_lr_mult: 1.0
  weight_decay: 0.01
  schedule: onecycle
  warmup_pct: 0.1
  epochs: 10
  batch_size: 4  # 4 x 4 accumulation keeps the effective batch at 16
  grad_accum: 4
  max_grad_norm: 1.0
  amp: true
  amp_dtype: bf16

folds:
  n_folds: 5
  file: data/folds/folds_v2.csv  # 685 studies held out as a test split
  column: fold
